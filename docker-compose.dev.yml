version: '3.8'
services:
  mongo:
    image: mongo:8.0.3
    container_name: coral-mongo-dev
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=coral
    volumes:
      - mongo-data:/data/db
    
  redis:
    image: redis:7.2.5
    container_name: coral-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
