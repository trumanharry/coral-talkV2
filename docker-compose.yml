version: '3.8'
services:
  talk:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
      - "8080:8080"
    depends_on:
      - mongo
      - redis
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/coral
      - REDIS_URI=redis://redis:6379
      - SIGNING_SECRET=dev-secret-change-me-in-production
      - ROOT_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    command: ["pnpm", "run", "watch"]
    
  mongo:
    image: mongo:8.0.3
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      
  redis:
    image: redis:7.2.5
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data: